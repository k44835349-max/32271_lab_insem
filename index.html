<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Display</title>
    <style>
        body {
            background-color: #0077b6;
            font-family: Arial, sans-serif;
        }

        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        img {
            width: 120px;
            height: 100px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Our Products</h1>

    <table>
        <tr>
            <th>Product Image</th>
            <th>Name</th>
            <th>Price</th>
            <th>Category</th>
        </tr>
        <tr>
            <td><img src="images/apple.jpg" alt="Red apples"></td>
            <td>Apple</td>
            <td>₹20</td>
            <td>Fruit</td>
        </tr>
        <tr>
            <td><img src="images/pencil.jpg" alt="Pencils"></td>
            <td>Pencil</td>
            <td>₹10</td>
            <td>Stationery</td>
        </tr>
        <tr>
            <td><img src="images/bike.jpg" alt="Motorcycle"></td>
            <td>Motorcycle</td>
            <td>₹1,00,000</td>
            <td>Vehicle</td>
        </tr>
    </table>
</body>
</html>
